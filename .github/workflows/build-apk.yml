name: Build PDB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PDB-control-v2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        run: |
          mkdir -p unpacked
          unzip -q PDB-control-v2.zip -d unpacked
          test -d unpacked/PDB/app
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/unpacked/PDB" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Compose compiler plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build.gradle.kts")
          app = Path("app/build.gradle.kts")
          root_text = root.read_text()
          app_text = app.read_text()
          plugin = '    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false'
          if "org.jetbrains.kotlin.plugin.compose" not in root_text:
              root_text = root_text.replace("plugins {", "plugins {\n" + plugin, 1)
              root.write_text(root_text)
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in app_text:
              app_text = app_text.replace("plugins {", 'plugins {\n    id("org.jetbrains.kotlin.plugin.compose")', 1)
              app.write_text(app_text)
          print("Compose compiler Gradle plugin configured.")

      - name: Repair Kotlin source and navigation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_root = Path("app/src")
          visual_files = list(source_root.rglob("VisualizationScreen.kt"))
          nav_files = list(source_root.rglob("Nav.kt"))
          assert len(visual_files) == 1, f"Expected one VisualizationScreen.kt, found {len(visual_files)}"
          assert len(nav_files) == 1, f"Expected one Nav.kt, found {len(nav_files)}"

          visual = visual_files[0]
          text = visual.read_text()
          import_line = "import androidx.compose.ui.graphics.drawscope.clipPath"
          text = text.replace("\\\\nimport androidx.compose.ui.graphics.drawscope.clipPath", "\nimport androidx.compose.ui.graphics.drawscope.clipPath")
          text = text.replace("\\nimport androidx.compose.ui.graphics.drawscope.clipPath", "\nimport androidx.compose.ui.graphics.drawscope.clipPath")
          if import_line not in text.splitlines():
              anchor = "import androidx.compose.ui.graphics.*"
              assert anchor in text, "Graphics import anchor not found"
              text = text.replace(anchor, anchor + "\n" + import_line, 1)
          assert import_line in text.splitlines(), "clipPath must be a separate Kotlin import line"
          visual.write_text(text)

          nav = nav_files[0]
          nav.write_text("""package com.stahij.pdb.core.navigation

          import androidx.compose.runtime.Composable
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.stahij.pdb.feature.builder.BuilderScreen
          import com.stahij.pdb.feature.visualization.VisualizationScreen

          @Composable
          fun AppNavHost() {
              val navController = rememberNavController()
              NavHost(navController = navController, startDestination = "builder") {
                  composable("builder") {
                      BuilderScreen(onVisualize = { navController.navigate("visualization") })
                  }
                  composable("visualization") {
                      VisualizationScreen(onBack = { navController.popBackStack() })
                  }
              }
          }
          """)
          print(f"Fixed {visual} and aligned {nav} with the actual screen signatures.")
          PY

      - name: Verify patched source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          visual = next(Path("app/src").rglob("VisualizationScreen.kt")).read_text()
          nav = next(Path("app/src").rglob("Nav.kt")).read_text()
          assert "import androidx.compose.ui.graphics.drawscope.clipPath" in visual.splitlines()
          assert "BuilderScreen(onVisualize =" in nav
          assert "VisualizationScreen(onBack =" in nav
          print("Source verification passed.")
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDB-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
