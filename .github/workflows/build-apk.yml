name: Build PDB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PDB-control-v2.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive
        run: |
          mkdir -p unpacked
          unzip -q PDB-control-v2.zip -d unpacked
          test -d unpacked/PDB/app
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/unpacked/PDB" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Inspect Android Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts
          echo "===== root build.gradle.kts ====="
          cat build.gradle.kts
          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

      - name: Configure Compose compiler plugin
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build.gradle.kts")
          app = Path("app/build.gradle.kts")
          root_text = root.read_text()
          app_text = app.read_text()
          plugin = '    id("org.jetbrains.kotlin.plugin.compose") version "2.2.10" apply false'
          if "org.jetbrains.kotlin.plugin.compose" not in root_text:
              root_text = root_text.replace("plugins {", "plugins {\n" + plugin, 1)
              root.write_text(root_text)
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in app_text:
              app_text = app_text.replace('plugins {', 'plugins {\n    id("org.jetbrains.kotlin.plugin.compose")', 1)
              app.write_text(app_text)
          print("Compose compiler Gradle plugin configured (Kotlin 2.2.10).")
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDB-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
